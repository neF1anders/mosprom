[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tuning"

[project]
name = "mosprom"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/e2e/tuning"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = [".scratch", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/tuning"]
