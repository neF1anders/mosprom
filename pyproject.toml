[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research", "src/mesh_analysis.py", "tests/test_mesh_analysis.py", "tests/verify_stl_reports.py", "tests/e2e/test_stl_cli.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "src.mesh_analysis"
follow_imports = "skip"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
