[project]
name = "mosprom-stage-one"
version = "0.1.0"
description = "Local task interpretation and STL analysis for STE Slicer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite==0.21.0",
    "fastapi==0.161.1",
    "httpx==0.28.1",
    "json-repair==0.64.2",
    "networkx==3.5",
    "numpy==2.3.4",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pypdf==6.21.2",
    "pypdfium2==5.14.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "rtree==1.4.1",
    "scipy==1.16.2",
    "sqlalchemy[asyncio]==2.0.55",
    "starlette==1.9.0",
    "trimesh==5.1.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "packaging==26.3",
    "mypy==2.4.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.17.2",
    "jsonschema==4.25.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research", "src/mesh_analysis.py", "tests/test_mesh_analysis.py", "tests/verify_stl_reports.py", "tests/e2e/test_stl_cli.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "src.mesh_analysis"
follow_imports = "skip"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
